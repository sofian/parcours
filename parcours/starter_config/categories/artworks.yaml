name: artworks
handler: generic
fields:
  - {name: id,             generated: true}                     # artwork-2026-004
  - {name: weight,         type: int}                           # optional; higher = appears earlier, refines/overrides date-based ordering
  - {name: title_en}
  - {name: title_fr}                                             # usually only one filled — see require_one_of
  - {name: short_title}                                          # the name the work usually goes by (e.g. in exhibitions' `artworks`), if shorter than its title
  - {name: series}                                               # the project several works belong to; exhibitions' `artworks` may name it instead of each work
  - {name: role,           required: true, vocab: artwork_role, default: author}  # author / collaborator
  - {name: status,         vocab: artwork_status, glossary: artwork_status}  # in-progress / completed — blank = completed
  - {name: date,           type: date, precision: year, required: true, required_unless: {status: in-progress}}  # production year
  - {name: description_en, sentence: true}
  - {name: description_fr, sentence: true}                                       # CCV's "Description / Contribution Value"
  - {name: co_authors,     type: person_list}                    # other primary authors (not you) — "Last, First; Last, First"
  - {name: collaborators,  type: person_list}                    # named collaborators, credited separately from primary authorship — same format
  - {name: url}
  - {name: comment,      type: text}                               # notes for whoever enters the data; never on a CV by default, skipped by --search
require_one_of:
  - [title_en, title_fr]
dedup:
  - when: [{fuzzy: [title_en, title_fr]}, {same_year: date}]
    as: duplicate

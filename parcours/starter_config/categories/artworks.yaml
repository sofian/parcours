name: artworks
handler: generic
fields:
  - {name: id,             generated: true}                     # artwork-2026-004
  - {name: weight,         type: int}                           # optional; higher = appears earlier, refines/overrides date-based ordering
  - {name: title_en}
  - {name: title_fr}                                             # usually only one filled — see require_one_of
  - {name: role,           required: true, vocab: artwork_role, default: author}  # author / collaborator
  - {name: date,           type: date, precision: year, required: true}  # production year
  - {name: description_en}
  - {name: description_fr}                                       # CCV's "Description / Contribution Value"
  - {name: co_authors}                                           # other primary authors (not you) — "Last, First; Last, First"
  - {name: collaborators}                                        # named collaborators, credited separately from primary authorship — same "Last, First; Last, First" format
  - {name: url}
require_one_of:
  - [title_en, title_fr]
dedup:
  - when: [{fuzzy: [title_en, title_fr]}, {same_year: date}]
    as: duplicate

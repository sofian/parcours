name: grants
handler: generic
fields:
  - {name: id,           generated: true}                   # grant-frqsc-2026
  - {name: weight,       type: int}                         # optional; higher = appears earlier, refines/overrides date-based ordering
  - {name: title_en}
  - {name: title_fr}
  - {name: funder,       required: true, glossary: organization}  # free text
  - {name: program,      glossary: program}                  # e.g. "Concept to Realization"
  - {name: role,         required: true, vocab: grant_role, glossary: grant_role}  # PI / co-PI / co-applicant / collaborator
  - {name: status,       required: true, vocab: grant_status}   # submitted / awarded / declined
  - {name: start_date,   type: date, precision: year, required: true}  # partial = first day of the month/year
  - {name: end_date,     type: date, precision: year}       # blank = ongoing; partial = last day of the month/year
  - {name: amount,       type: number}
  - {name: currency,     default: $currency.default}         # from parco.yaml, e.g. CAD
  - {name: co_investigators, type: person_list}
  - {name: note_en}
  - {name: note_fr}
  - {name: comment,      type: text}                               # notes for whoever enters the data; never on a CV by default, skipped by --search
dedup:
  - when: [{exact: funder}, {overlap: [start_date, end_date]}, {fuzzy: [title_en, title_fr]}]
    as: duplicate

name: presentations
handler: generic
fields:
  - {name: id,        generated: true}                                  # presentation-2026-004
  - {name: weight,    type: int}                                        # optional; higher = appears earlier, refines/overrides date-based ordering
  - {name: title_en}
  - {name: title_fr}                                                    # usually only one filled
  - {name: event_en}
  - {name: event_fr}                                                    # Conference / Event Name — usually only one filled (e.g. "Colloque ACFAS" has no English name)
  - {name: city,      required: true, glossary: city}                                        # e.g. "The Hague"
  - {name: country,   required: true, required_unless: {city: Online}, glossary: country}                                     # e.g. "Netherlands" — pre-populated in translations.csv at `init`, see Translations
  - {name: invited,   type: bool}
  - {name: keynote,   type: bool}
  - {name: format,    vocab: presentation_format}                     # talk / panel / round-table / workshop / poster / special-session
  - {name: date,      type: date, precision: year, required: true}      # a year is enough; add month/day when known
  - {name: description_en}
  - {name: description_fr}
  - {name: co_presenters,   type: person_list}                            # "Last, First; Last, First"
  - {name: url}
require_one_of:
  - [event_en, event_fr]                                               # title is optional: a panel/festival may only have an event name
dedup:
  - when: [{fuzzy: [title_en, title_fr]}, {same_year: date}]
    as: duplicate
